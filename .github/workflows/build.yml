# Compila la DLL en GitHub (no hace falta instalar nada en tu equipo).
# Sube el proyecto a un repositorio, ve a Actions > build > Run workflow y descarga el artefacto.
# Con cada cambio en main, además, publica la versión en la rama "publicado", de donde la bajan el instalador y la
# actualización automática de cada equipo.
name: build

on:
  push:
    # Las ramas pruebas/... se compilan y se prueban, pero no se publican (publicar solo corre en main)
    branches: [main, 'pruebas/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar DLL nativa
        run: dotnet publish src/ClaudeCodePlsql.csproj -c Release -r win-${{ matrix.arch }} -o dist/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCodePlsql-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/ClaudeCodePlsql.dll

  # Pruebas del panel de sesiones (servidor, anfitrión y página) en Linux, con una sesión de bash de prueba
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar el panel
        run: |
          cd panel
          npm ci --no-audit --no-fund
          npm run prueba

  # La rama "publicado" solo lleva lo que necesita un equipo: la DLL de 64 bits, los scripts, el paquete de skills y
  # la documentación. Se rehace entera en cada versión (las copias de los equipos la bajan con fetch + reset).
  publicar:
    needs: [build, panel]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ClaudeCodePlsql-x64
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El panel de sesiones se publica con sus dependencias ya bajadas, con las piezas nativas de Windows de 64 bits:
      # en el equipo solo hace falta Node.js. Lleva también la ayuda del plug-in (la enseña en /ayuda). Su VERSION
      # cambia solo cuando cambia algo de las carpetas panel o ayuda.
      - name: Preparar el panel de sesiones
        run: |
          cp ayuda/ayuda.html panel/web/ayuda.html
          cd panel
          npm ci --omit=dev --os=win32 --cpu=x64 --no-audit --no-fund
          find node_modules -name '*.pdb' -delete
          rm -rf pruebas
          echo "$(git rev-parse HEAD:panel)$(git rev-parse HEAD:ayuda)" | sha1sum | cut -c1-12 > VERSION

      - name: Publicar en la rama publicado
        run: |
          mkdir pub
          cp dist/ClaudeCodePlsql.dll instalar.ps1 actualizar.ps1 README.md CAMBIOS.md pub/
          cp -r paquete panel pub/
          printf '* -text\n' > pub/.gitattributes
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" > pub/VERSION
          cd pub
          git init -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Versión ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
