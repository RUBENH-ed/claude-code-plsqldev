<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mis expedientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Disposición: bandeja de dos columnas — lista de expedientes a la izquierda y ficha del caso a la derecha; en móvil, una cosa cada vez */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --fg: #17202D;
  --muted: #586376;
  --line: #D8DEE8;
  --accent: #2553C7;
  --accent-soft: #E1E8FB;
  --on-accent: #FFFFFF;
  --ok: #1D7A4B;
  --ok-soft: #DFF1E7;
  --warn: #965800;
  --warn-soft: #F9EED8;
  --bad: #B42318;
  --bad-soft: #FBE5E2;
  --shadow: 0 1px 2px rgba(20, 30, 50, .07), 0 6px 18px rgba(20, 30, 50, .05);
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-tit: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1219; --surface: #141B26; --surface-2: #1B2431; --fg: #E4E8EF; --muted: #9AA4B5;
    --line: #283245; --accent: #8DAAFF; --accent-soft: #1C2843; --on-accent: #0D1219;
    --ok: #62CC9E; --ok-soft: #14302A; --warn: #E8B463; --warn-soft: #33291A; --bad: #F3958D; --bad-soft: #3B1F1E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1219; --surface: #141B26; --surface-2: #1B2431; --fg: #E4E8EF; --muted: #9AA4B5;
  --line: #283245; --accent: #8DAAFF; --accent-soft: #1C2843; --on-accent: #0D1219;
  --ok: #62CC9E; --ok-soft: #14302A; --warn: #E8B463; --warn-soft: #33291A; --bad: #F3958D; --bad-soft: #3B1F1E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-ui); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; margin-bottom: 18px; }
.top h1 { font: 600 24px/1.1 var(--f-tit); letter-spacing: .01em; }
.sub { margin-top: 5px; color: var(--muted); font-size: 13px; }
.sub strong { color: var(--fg); font-weight: 500; }
.filtros { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; }
.filtros button { border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--f-ui); padding: 8px 13px; border-radius: 999px; cursor: pointer; }
.filtros button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.filtros .c { font: 500 12px/1 var(--f-mono); margin-left: 5px; }

.layout { display: grid; grid-template-columns: minmax(270px, 340px) minmax(0, 1fr); gap: 22px; align-items: start; }
.lista { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tarjetas { display: flex; flex-direction: column; gap: 8px; }
.tarjeta { display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; font: inherit; }
.tarjeta:hover { border-color: var(--muted); }
.tarjeta.sel { border-color: var(--accent); background: var(--accent-soft); }
.t-fila { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.num { font: 500 13px/1 var(--f-mono); letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.t-tit { font: 600 15px/1.25 var(--f-tit); letter-spacing: .015em; overflow-wrap: anywhere; }
.t-sub { color: var(--muted); font-size: 12.5px; }
.t-cont { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.pill { font: 500 11.5px/1 var(--f-ui); padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.nuevo { background: var(--accent); color: var(--on-accent); }
.pill.ojo { background: var(--warn-soft); color: var(--warn); }
.pill.mal { background: var(--bad-soft); color: var(--bad); }
.chip { font: 500 10.5px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.est-abierto { color: var(--ok); border-color: var(--ok); }
.chip.est-en_espera { color: var(--warn); border-color: var(--warn); }
.chip.ejemplo { color: var(--accent); border-color: var(--accent); }
.prog { font-size: 12px; color: var(--muted); }

.avisos { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.avisos h3 { font: 600 12px/1.2 var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.avisos ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.avisos li { font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.avisos .pista { color: var(--muted); font-size: 12px; }
.avisos .acciones { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.quitar { border: 0; background: transparent; padding: 0; font: 12px var(--f-ui); color: var(--muted); text-decoration: underline; cursor: pointer; }
.quitar:hover { color: var(--fg); }

.detalle { min-width: 0; }
.nada, .vacio { color: var(--muted); padding: 28px 4px; }
.vacio strong { color: var(--fg); font-weight: 500; }
.ficha { display: flex; flex-direction: column; gap: 22px; }
.cab { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.volver { display: none; align-self: flex-start; border: 0; background: transparent; color: var(--accent); font: 500 13px/1 var(--f-ui); padding: 4px 0; cursor: pointer; }
.cab-fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.num.grande { font-size: 15px; color: var(--accent); }
.tit { font: 600 27px/1.1 var(--f-tit); letter-spacing: .01em; overflow-wrap: anywhere; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin: 0; }
.datos dt { font: 500 10.5px/1.2 var(--f-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.datos dd { margin: 3px 0 0; font-variant-numeric: tabular-nums; }
.datos dd .mal { color: var(--bad); }
.datos dd .ojo { color: var(--warn); }
.datos .ancho { grid-column: 1 / -1; }
.ruta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ruta code { font: 12.5px/1.4 var(--f-mono); overflow-wrap: anywhere; background: var(--surface-2); padding: 3px 7px; border-radius: 6px; min-width: 0; }
.circuito { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.circuito .lbl { font: 500 10.5px/1.2 var(--f-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 4px; }
.doc { font: 500 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.doc::before { content: ""; width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid currentColor; }
.doc.si { border-style: solid; border-color: var(--ok); color: var(--ok); }
.doc.si::before { background: currentColor; }

.bloque { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.b-tit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.b-tit h3 { font: 600 12px/1.2 var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.b-tit .n { font: 500 12px/1 var(--f-mono); color: var(--fg); text-transform: none; letter-spacing: 0; }
.sub-h { font: 500 12.5px/1.2 var(--f-ui); color: var(--fg); margin-top: 4px; }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 26px; }
.md { display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.md ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.md h4 { font: 600 14px/1.3 var(--f-ui); }
.md code { font: 12.5px var(--f-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
.check label { display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.check .meta { color: var(--muted); font-size: 12px; }
.check .meta.mal { color: var(--bad); }
.check.hecho .txt { text-decoration: line-through; color: var(--muted); }
.sinnada { color: var(--muted); font-size: 13px; padding: 6px 0; }
.ir { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ir:hover { text-decoration: underline; }
.nuevo { display: flex; gap: 8px; }
.nuevo input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.nuevo button, .prim { font: 500 13px/1 var(--f-ui); padding: 9px 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.sec { font: 500 12.5px/1 var(--f-ui); padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.sec:disabled, .nuevo button:disabled { opacity: .5; cursor: default; }

.linea { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.nov { display: flex; flex-direction: column; gap: 5px; padding: 11px 13px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.nov.nueva { border-color: var(--accent); }
.nov-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.canal { font: 500 10.5px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .06em; padding: 3px 6px; border-radius: 5px; background: var(--surface-2); color: var(--fg); }
.nov-asunto { font-weight: 500; overflow-wrap: anywhere; }
.hecho-it { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 13.5px; padding: 2px 0; }
.hecho-it time { font: 12px/1.65 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.hecho-it .org { color: var(--muted); font-size: 12px; }
.mas { align-self: flex-start; }
.personas, .docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.personas li, .docs li { display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
.personas .rol, .docs .det { color: var(--muted); font-size: 12px; }
.personas .mail { font: 12px var(--f-mono); color: var(--fg); user-select: all; }
.claves { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.claves code { font: 12px var(--f-mono); color: var(--fg); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); z-index: 20; max-width: calc(100% - 32px); }

.convs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.conv { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.conv .c-tit { overflow-wrap: anywhere; min-width: 0; }
.conv .c-meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.avisos .convs { margin: 4px 0 2px; padding-left: 10px; border-left: 2px solid var(--line); }

@media (max-width: 1100px) { .dos { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .layout.con-detalle .lista { display: none; }
  .layout:not(.con-detalle) .detalle { display: none; }
  .volver { display: inline-flex; }
  .tit { font-size: 22px; }
  .cab { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Mis expedientes</h1>
      <p class="sub" id="rev-linea">Conectando con el panel…</p>
    </div>
    <div class="filtros" role="tablist" aria-label="Filtrar expedientes">
      <button type="button" role="tab" id="f-activos" data-accion="filtro" data-filtro="activos" aria-selected="true">Activos<span class="c" id="c-activos"></span></button>
      <button type="button" role="tab" id="f-cerrados" data-accion="filtro" data-filtro="cerrados" aria-selected="false">Cerrados<span class="c" id="c-cerrados"></span></button>
      <button type="button" role="tab" id="f-todos" data-accion="filtro" data-filtro="todos" aria-selected="false">Todos<span class="c" id="c-todos"></span></button>
    </div>
  </header>
  <div class="layout" id="layout">
    <aside class="lista" aria-label="Expedientes">
      <div class="tarjetas" id="tarjetas"><p class="vacio">Cargando expedientes…</p></div>
      <p class="prog" id="prog"></p>
      <section class="avisos" id="avisos" hidden></section>
      <section class="avisos" id="conv-sin" hidden></section>
    </aside>
    <main class="detalle" id="detalle"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";

  var TZ = "Europe/Madrid";
  var ESTADOS = { abierto: "Abierto", en_espera: "En espera", cerrado: "Cerrado" };
  var TIPOS = { desarrollo: "Desarrollo", incidencia: "Incidencia" };
  var CIRCUITO = { desarrollo: ["A10", "D10", "A18", "MANUAL"], incidencia: ["A17", "D17", "A18"] };
  var CANALES = { correo: "Correo", teams: "Teams", crm: "CRM", carpeta: "Carpeta", documentacion: "Documentación", manual: "A mano", claude: "Claude", pendiente: "Pendiente", compromiso: "Compromiso" };
  var SUBCOL = ["pendientes", "compromisos", "novedades", "hecho"];

  var st = {
    db: null, cargado: false, casos: [], ajustes: null, rev: null, avisos: null,
    filtro: leer("filtro") || "activos", sel: null,
    sub: vacioSub(), unsubs: [], verNov: false, verHecho: false, soloLectura: false,
    convs: []
  };

  // ---- Conversaciones con Claude de cada expediente (las apunta el mod «Expediente activo») ----
  var FUENTES = { carpeta: "detectado en la carpeta", crm: "ruta del CRM", rama: "rama iadev", texto: "mencionado en la conversación", manual: "fijado con /exp", memoria: "conversaciones anteriores" };
  function recientePrimero(a, b) { return String(b.d.actualizado || "").localeCompare(String(a.d.actualizado || "")); }
  function convsDe(exp) { return st.convs.filter(function (x) { return x.d.expediente === exp; }).sort(recientePrimero); }
  function itemConv(x) {
    var v = x.d, u = enlace(v.enlace);
    var meta = [FUENTES[v.fuente] || v.fuente, fRel(v.actualizado)].filter(Boolean).join(" · ");
    return "<li class=\"conv\"><span class=\"c-tit\">" + esc(v.titulo || "Conversación sin título") + "</span>" +
      (meta ? "<span class=\"c-meta\">" + esc(meta) + "</span>" : "") +
      (u ? "<a class=\"ir\" href=\"" + esc(u) + "\" target=\"_blank\" rel=\"noopener\">Abrir conversación</a>" : "") + "</li>";
  }
  function pintarConvsSinFicha() {
    var el = $("conv-sin"); if (!el) return;
    var conFicha = {}, grupos = {}, claves = [];
    st.casos.forEach(function (c) { conFicha[c.d.expediente || c.id] = true; });
    st.convs.forEach(function (x) {
      var e = x.d.expediente; if (!e || conFicha[e]) return;
      if (!grupos[e]) { grupos[e] = []; claves.push(e); }
      grupos[e].push(x);
    });
    if (!claves.length) { el.innerHTML = ""; el.hidden = true; return; }
    claves.forEach(function (e) { grupos[e].sort(recientePrimero); });
    claves.sort(function (a, b) { return String(grupos[b][0].d.actualizado || "").localeCompare(String(grupos[a][0].d.actualizado || "")); });
    el.innerHTML = "<h3>En conversaciones, sin proyecto</h3><ul>" + claves.map(function (e) {
      var lista = grupos[e], conNombre = lista.filter(function (x) { return x.d.nombre; })[0];
      return "<li><span><span class=\"num\">" + esc(e) + "</span> " + esc(conNombre ? conNombre.d.nombre : "") + "</span>" +
        "<ul class=\"convs\">" + lista.slice(0, 4).map(itemConv).join("") + "</ul>" +
        (lista.length > 4 ? "<span class=\"pista\">y " + esc(pl(lista.length - 4, "conversación más", "conversaciones más")) + "</span>" : "") +
        "<span class=\"pista\">Para crear el proyecto: «crea el proyecto del " + esc(e) + "»</span></li>";
    }).join("") + "</ul>";
    el.hidden = false;
  }

  function vacioSub() { return { pendientes: [], compromisos: [], novedades: [], hecho: [] }; }
  function leer(k) { try { return localStorage.getItem("mx." + k); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem("mx." + k, v); } catch (e) { /* sin almacenamiento */ } }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function enlace(u) { return typeof u === "string" && /^https:\/\//i.test(u) ? u : ""; }
  function pl(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function isoAhora() { return new Date().toISOString().replace(/\.\d{3}Z$/, "Z"); }

  // ---- Fechas: "AAAA-MM-DD" para días, ISO UTC para instantes ----
  function aFecha(v) {
    if (!v) return null;
    var d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + "T12:00:00Z") : new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }
  function diaDe(d) { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d); }
  function hoy() { return diaDe(new Date()); }
  function fDia(v) { var d = aFecha(v); return d ? new Intl.DateTimeFormat("es-ES", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric" }).format(d) : ""; }
  function fHora(d) { return new Intl.DateTimeFormat("es-ES", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(d); }
  function diasEntre(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5); }
  function diasHasta(v) { return v ? diasEntre(hoy(), String(v).slice(0, 10)) : null; }
  function fRel(v) {
    var d = aFecha(v); if (!d) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return fDia(v);
    var n = diasEntre(diaDe(d), hoy());
    if (n === 0) return "hoy " + fHora(d);
    if (n === 1) return "ayer " + fHora(d);

    var cv = convsDe(d.expediente || c.id);
    $("d-ncv").textContent = cv.length || "";
    $("d-conv").innerHTML = cv.map(itemConv).join("") || "<li class=\"sinnada\">Todavía no hay conversaciones apuntadas. Se apuntan solas cuando hablas del expediente con Claude.</li>";
  }

  // ---- Selección y suscripciones ----
  function seleccionar(exp, sinScroll) {
    if (st.sel === exp) return;
    st.unsubs.forEach(function (u) { try { u(); } catch (e) { /* ya cerrada */ } });
    st.unsubs = []; st.sub = vacioSub(); st.verNov = false; st.verHecho = false;
    st.sel = exp || null;
    guardar("sel", st.sel || "");
    if (st.sel && st.db) {
      SUBCOL.forEach(function (col) {
        st.unsubs.push(st.db.collection("expedientes/" + st.sel + "/" + col).onSnapshot(function (snap) {
          st.sub[col] = snap.docs.map(function (x) { return { id: x.id, d: x.data() || {} }; });
          rellenarDetalle();
        }, errDb));
      });
    }
    $("layout").classList.toggle("con-detalle", !!st.sel);
    pintarLista();
    montarDetalle();
    if (!sinScroll) window.scrollTo(0, 0);
  }

  // ---- Escrituras (una cada vez) ----
  var cola = Promise.resolve();
  function enCola(fn) { cola = cola.then(fn).catch(errEscritura); return cola; }
  function errEscritura(e) {
    var code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted") { st.soloLectura = true; aviso("Este panel está en solo lectura para ti."); }
    else if (code === "quota_exceeded") aviso("El panel está lleno. Pide a Claude que archive expedientes cerrados.");
    else aviso("No se ha podido guardar. Vuelve a intentarlo en un momento.");
    rellenarDetalle();
  }
  function errDb(e) {
    if (e && e.code === "revoked") aviso("Ya no tienes acceso a este panel.");
    else aviso("Se ha cortado la conexión con el panel. Recarga la página.");
  }
  function contar(cambio) {
    function val(col, x) { return cambio && cambio.col === col && cambio.id === x.id ? Object.assign({}, x.d, cambio.patch) : x.d; }
    var c = casoSel(), vistas = (c && c.d.novedades_vistas_hasta) || "";
    var comps = st.sub.compromisos.map(function (x) { return val("compromisos", x); }).filter(function (v) { return v.estado !== "cumplido"; });
    var n = {
      pendientes: st.sub.pendientes.filter(function (x) { return !val("pendientes", x).hecho; }).length,
      compromisos_mios: comps.filter(function (v) { return v.quien === "yo"; }).length,
      compromisos_otros: comps.filter(function (v) { return v.quien !== "yo"; }).length,
      novedades_sin_ver: st.sub.novedades.filter(function (x) { return String(x.d.registrado || "") > String(vistas); }).length
    };
    if (cambio && cambio.nuevoPend) n.pendientes += 1;
    return n;
  }
  function guardarContadores(cambio) {
    var c = casoSel(); if (!c) return Promise.resolve();
    var n = contar(cambio), prev = c.d.contadores || {};
    var igual = Object.keys(n).every(function (k) { return prev[k] === n[k]; });
    if (igual) return Promise.resolve();
    return st.db.doc("expedientes/" + c.id).update({ contadores: n });
  }
  function marcarPendiente(id, hecho) {
    var patch = hecho ? { hecho: true, fecha_hecho: hoy() } : { hecho: false, fecha_hecho: "" };
    return st.db.doc("expedientes/" + st.sel + "/pendientes/" + id).update(patch)
      .then(function () { return guardarContadores({ col: "pendientes", id: id, patch: patch }); });
  }
  function marcarCompromiso(id, cumplido) {
    var patch = cumplido ? { estado: "cumplido", fecha_cumplido: hoy() } : { estado: "pendiente", fecha_cumplido: "" };
    return st.db.doc("expedientes/" + st.sel + "/compromisos/" + id).update(patch)
      .then(function () { return guardarContadores({ col: "compromisos", id: id, patch: patch }); });
  }
  function nuevoPendiente(texto) {
    var id = "p-" + Date.now().toString(36);
    return st.db.doc("expedientes/" + st.sel + "/pendientes/" + id)
      .set({ texto: texto, origen: "manual", creado: hoy(), fecha_limite: "", hecho: false, fecha_hecho: "", enlace: "" })
      .then(function () {
        var ya = st.sub.pendientes.some(function (x) { return x.id === id; });
        return guardarContadores(ya ? null : { nuevoPend: true });
      })
      .then(function () { aviso("Pendiente añadido."); });
  }
  function marcarVisto() {
    var c = casoSel(); if (!c) return Promise.resolve();
    var n = contar(); n.novedades_sin_ver = 0;
    return st.db.doc("expedientes/" + c.id).update({ novedades_vistas_hasta: isoAhora(), contadores: n });
  }
  function copiarRuta(btn) {
    var el = $("ruta-txt"); if (!el) return;
    var texto = el.textContent;
    function seleccionarTexto() { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); aviso("Ruta seleccionada: cópiala con Ctrl+C."); }
    try {
      navigator.clipboard.writeText(texto).then(function () { btn.textContent = "Copiada"; setTimeout(function () { btn.textContent = "Copiar ruta"; }, 1800); }, seleccionarTexto);
    } catch (e) { seleccionarTexto(); }
  }

  // ---- Eventos ----
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-accion]"); if (!b) return;
    var a = b.getAttribute("data-accion");
    if (a === "abrir") seleccionar(b.getAttribute("data-exp"));
    else if (a === "volver") seleccionar(null);
    else if (a === "filtro") { st.filtro = b.getAttribute("data-filtro"); guardar("filtro", st.filtro); pintarLista(); }
    else if (a === "visto") enCola(marcarVisto);
    else if (a === "copiar") copiarRuta(b);
    else if (a === "ver-nov") { st.verNov = !st.verNov; rellenarDetalle(); }
    else if (a === "ver-hecho") { st.verHecho = !st.verHecho; rellenarDetalle(); }
    else if (a === "descartar") {
      var tipo = b.getAttribute("data-tipo"), id = b.getAttribute("data-id"), idx = Number(b.getAttribute("data-i"));
      enCola(function () { return descartar(tipo, id, idx); });
    }
  });
  document.addEventListener("change", function (ev) {
    var i = ev.target; if (!i.matches || !i.matches("input[type=checkbox][data-accion]")) return;
    var id = i.getAttribute("data-id"), on = i.checked;
    if (i.getAttribute("data-accion") === "pend") enCola(function () { return marcarPendiente(id, on); });
    else if (i.getAttribute("data-accion") === "comp") enCola(function () { return marcarCompromiso(id, on); });
  });
  document.addEventListener("submit", function (ev) {
    if (!ev.target || ev.target.id !== "f-nuevo") return;
    ev.preventDefault();
    var inp = $("nuevo-pend"), t = inp.value.trim(); if (!t || !st.sel) return;
    inp.value = "";
    enCola(function () { return nuevoPendiente(t); });
  });

  // ---- Arranque ----
  function sinDb(msg) {
    $("rev-linea").textContent = msg;
    $("tarjetas").innerHTML = "<div class=\"vacio\"><p><strong>No se pueden mostrar los expedientes aquí.</strong></p><p>" + esc(msg) + "</p></div>";
  }
  function arrancar() {
    pintarFiltros();
    if (!window.claude || typeof window.claude.use !== "function") { sinDb("Abre este panel desde claude.ai con tu cuenta para ver tus expedientes."); return; }
    window.claude.use("db").then(function (db) {
      if (!db) { sinDb("Esta vista no puede abrir la base de datos del panel. Ábrelo desde claude.ai con tu cuenta."); return; }
      st.db = db;
      pintarCabecera();
      db.collection("expedientes").onSnapshot(function (snap) {
        st.casos = snap.docs.map(function (x) { return { id: x.id, d: x.data() || {} }; });
        var primera = !st.cargado; st.cargado = true;
        if (primera && !st.sel) {
          var h = (location.hash || "").slice(1), g = leer("sel");
          var cand = [h, g].filter(function (v) { return v && st.casos.some(function (c) { return c.id === v; }); })[0];
          var ancho = window.matchMedia && window.matchMedia("(min-width: 861px)").matches;
          if (!cand && ancho) { var act = st.casos.filter(activo).sort(orden)[0]; cand = act && act.id; }
          if (cand && (h === cand || ancho)) { seleccionar(cand, true); return; }
        }
        pintarLista();
        rellenarDetalle();
        if (!st.sel) montarDetalle();
      }, errDb);
      db.doc("config/ultima_revision").onSnapshot(function (s) { st.rev = s.exists ? s.data() : null; pintarCabecera(); }, errDb);
      db.doc("config/avisos").onSnapshot(function (s) { st.avisos = s.exists ? s.data() : null; pintarAvisos(); }, errDb);
      db.doc("config/ajustes").onSnapshot(function (s) { st.ajustes = s.exists ? s.data() : null; pintarCabecera(); }, errDb);
      db.collection("conversaciones").onSnapshot(function (snap) {
        st.convs = snap.docs.map(function (x) { return { id: x.id, d: x.data() || {} }; });
        pintarLista();
        rellenarDetalle();
      }, errDb);
    }, function () { sinDb("No se ha podido abrir la base de datos del panel."); });
  }
  arrancar();
})();
</script>
